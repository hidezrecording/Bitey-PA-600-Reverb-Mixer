# Builds Bitey on every push and uploads downloadable plugin files.
#
# Drop this into the Bitey repo at .github/workflows/build.yml
# (GitHub web UI: Add file -> Create new file, paste, commit).
# Then: Actions tab -> pick a run -> download the Bitey-macOS /
# Bitey-Windows artifacts. Those contain the actual VST3/AU files.
#
# NOTE: prepared 2026-10-01, not yet run. First green run may need
# small fixes (JUCE version pin, artifact paths) — that is normal.

name: Build Bitey

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  macos:
    name: macOS (VST3 + AU, Apple Silicon + Intel)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_BUILD_TYPE=Release
                 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
                 -S juce

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build installer PKG
        run: |
          PKGROOT=pkgroot
          mkdir -p "$PKGROOT/Library/Audio/Plug-Ins/VST3"
          mkdir -p "$PKGROOT/Library/Audio/Plug-Ins/Components"
          mkdir -p "$PKGROOT/Applications"
          cp -R "build/Bitey_artefacts/Release/VST3/Bitey.vst3" "$PKGROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R "build/Bitey_artefacts/Release/AU/Bitey.component" "$PKGROOT/Library/Audio/Plug-Ins/Components/"
          if [ -d "build/Bitey_artefacts/Release/Standalone/Bitey.app" ]; then
            cp -R "build/Bitey_artefacts/Release/Standalone/Bitey.app" "$PKGROOT/Applications/"
          fi
          # Include the Test Host app (has "Load Audio File..." for testing)
          if [ -d "build/BiteyTestHost_artefacts/Release/Bitey Test Host.app" ]; then
            cp -R "build/BiteyTestHost_artefacts/Release/Bitey Test Host.app" "$PKGROOT/Applications/"
          fi
          pkgbuild --root "$PKGROOT" \
            --identifier com.sabatinoaudio.bitey \
            --version 0.3.2 \
            --install-location / \
            --scripts pkg_scripts \
            Bitey-PA200-0.3.2-TEST2-macOS.pkg

      - name: Verify installer scripts embedded in PKG
        run: |
          rm -rf /tmp/pkgx && mkdir -p /tmp/pkgx
          pkgutil --expand-full "Bitey-PA200-0.3.2-TEST2-macOS.pkg" /tmp/pkgx/expanded
          echo "--- expanded pkg contents (scripts) ---"
          find /tmp/pkgx/expanded \( -name preinstall -o -name postinstall \) -print
          PRE=$(find /tmp/pkgx/expanded -name preinstall | head -1)
          POST=$(find /tmp/pkgx/expanded -name postinstall | head -1)
          test -n "$PRE" && test -n "$POST"
          grep -q "Bitey.component" "$PRE"
          grep -q "Bitey Test Host" "$PRE"
          grep -q "AudioComponentRegistrar" "$POST"
          echo "--- preinstall ---"; cat "$PRE"
          echo "--- postinstall ---"; cat "$POST"
          echo "SCRIPTS VERIFIED IN PKG"

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: Bitey-macOS-${{ github.run_number }}
          path: build/Bitey_artefacts/Release/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Bitey-Installer-macOS-${{ github.run_number }}
          path: Bitey-PA200-0.3.2-TEST2-macOS.pkg

      - name: Upload test host
        uses: actions/upload-artifact@v4
        with:
          name: Bitey-TestHost-macOS-${{ github.run_number }}
          path: build/BiteyTestHost_artefacts/Release/

      - name: Generate GUI screenshot
        run: |
          APP="build/BiteyTestHost_artefacts/Release/Bitey Test Host.app"
          if [ -d "$APP" ]; then
            "$APP/Contents/MacOS/Bitey Test Host" --screenshot /tmp/bitey-gui.png || true
            ls -lh /tmp/bitey-gui.png || echo "Screenshot failed"
          fi

      - name: Upload GUI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Bitey-GUI-Screenshot-${{ github.run_number }}
          path: /tmp/bitey-gui.png
          if-no-files-found: warn

  windows:
    name: Windows (VST3)
    # windows-latest now ships Visual Studio 2026 only, so the
    # "Visual Studio 17 2022" generator fails at configure time there.
    # windows-2022 still carries VS2022, which JUCE 8.0.6 targets.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -S juce

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer EXE
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Bitey.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: Bitey-Windows-${{ github.run_number }}
          path: build/Bitey_artefacts/Release/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Bitey-Installer-Windows-${{ github.run_number }}
          path: installer\output\Bitey-0.1.0-Windows-Setup.exe
